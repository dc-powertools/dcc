name: Auto-tag on version change

on:
  push:
    branches: [main]
    paths: ['Cargo.toml']
  workflow_call:
    inputs:
      ref:
        description: 'Exact commit to verify and tag after an automated bump'
        required: false
        type: string

jobs:
  # Gate the tag/release on green CI. Both entrypoints (the automatic push and
  # bump.yml) flow through here, so this gates them uniformly. The bump.yml push
  # uses GITHUB_TOKEN and so never triggers ci.yml's own push run — this reusable
  # call is the only CI it gets.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.ref || github.sha }}

  tag:
    name: Create tag if missing
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # Read and tag the same exact commit that passed CI. bump.yml supplies the
      # commit it created; the automatic push entrypoint uses the triggering SHA.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve version from Cargo.toml
        id: resolve
        run: echo "version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Create tag if it does not exist
        id: tag
        run: |
          TAG="v${{ steps.resolve.outputs.version }}"
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG."
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      ref: "v${{ needs.tag.outputs.version }}"
      ci_already_passed: true
