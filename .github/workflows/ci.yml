name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out; callers use this to pin CI to a release tag'
        required: false
        type: string

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Validate release workflow contracts
        run: bash scripts/check-release-workflow.sh

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test

  docker-test:
    name: Docker smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify Docker host
        run: |
          docker version
          docker info

      # These tests are ignored in Rust so local cargo test runs stay Docker-free.
      # GitHub-hosted Ubuntu runners provide a host Docker daemon for build/run tests.
      - name: Run ignored Docker tests
        run: |
          cargo test --test cli_flags strict_accepts_valid_config -- --ignored --exact --nocapture
          cargo test --test cli_flags exec_runs_direct_command -- --ignored --exact --nocapture
          cargo test --test cli_flags run_executes_named_command -- --ignored --exact --nocapture
          cargo test --test docker_smoke -- --ignored --nocapture --test-threads=1
          cargo test --test tls_oci_docker_smoke -- --ignored --nocapture --test-threads=1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build
